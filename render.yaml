# ============================================================================
# Blueprint de Render para la API de MimaCare
#
# Cómo usarlo:
#   1. Sube este archivo al repositorio (rama principal).
#   2. En Render: New + > Blueprint > conecta el repositorio.
#   3. Render pedirá el valor de SUPABASE_DB_PASSWORD (sync: false, no se guarda aquí).
#   4. Deploy. Al arrancar, la API aplica migraciones y seeders en Supabase.
#
# La base de datos de producción es Supabase (PostgreSQL gestionado).
# En desarrollo se sigue usando el PostgreSQL local (appsettings.Development.json
# o docker-compose.yml).
# ============================================================================

services:
  - type: web
    name: mimacare-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Plan free duerme tras 15 min de inactividad; cambia a "starter" para
    # tener el servicio siempre encendido.
    plan: free
    # Región de Render cercana al proyecto de Supabase (us-west-2 / Oregon).
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # --- Base de datos: Supabase (PostgreSQL gestionado) ---
      # NO uses db.<ref>.supabase.co: la conexión directa de Supabase es IPv6
      # y Render no tiene salida IPv6. El pooler (Supavisor) sí es IPv4.
      # Puerto 5432 = session mode (soporta las migraciones de EF Core).
      - key: SUPABASE_DB_HOST
        value: aws-1-us-west-2.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        value: postgres.asijdtstsbhetahbhgaq
      # Se solicita al crear el Blueprint; nunca se guarda en el repositorio.
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # --- Firma de los JWT que emite la API (usuarios logueados) ---
      # Render genera un valor aleatorio y lo mantiene entre deploys.
      - key: Jwt__Key
        generateValue: true

      # --- CORS: opcional, descomenta y pon el dominio del frontend ---
      # - key: Cors__AllowedOrigins
      #   value: https://mi-frontend.vercel.app
